<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Üçler Ortaokulu İtiraf</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:15px;
}

.box{
    width:100%;
    max-width:600px;
    background:#111827;
    padding:20px;
    border-radius:14px;
    margin-top:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    font-size:22px;
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:10px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:12px;
    padding:14px;
    font-size:17px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.captcha{
    font-size:30px;
    letter-spacing:6px;
    background:#000;
    padding:14px;
    border-radius:10px;
    text-align:center;
    margin-top:10px;
    user-select:none;
}

.rule{
    background:#020617;
    padding:12px;
    border-radius:10px;
    margin-top:8px;
    font-size:14px;
}

.post{
    background:#020617;
    padding:14px;
    border-radius:12px;
    margin-top:15px;
    font-size:15px;
    line-height:1.4;
}

.hidden{display:none;}

@media (min-width:768px){
    body{align-items:center;}
    .box{padding:30px;}
    h1{font-size:26px;}
    textarea{min-height:150px;}
}
</style>
</head>
<body>

<div class="box" id="captchaBox">
    <h1>Güvenlik Doğrulama</h1>
    <p>Kodu aynen yaz:</p>
    <div class="captcha" id="captchaText"></div>
    <input id="captchaInput" placeholder="Kodu buraya yaz">
    <button onclick="checkCaptcha()">Devam Et</button>
</div>

<div class="box hidden" id="rulesBox">
    <h1>Kurallar</h1>
    <div class="rule">• Yazdığınız itiraflar sadece sizde gözükür diğer kişilere hikayemizde atılır</div>
    <div class="rule">• İsim yazmak yasak</div>
    <div class="rule">• Öğretmen hedef almak yasak</div>
    <div class="rule">• Sorumluluk yazana ait</div>
    <button onclick="acceptRules()">Kabul Ediyorum</button>
</div>

<div class="box hidden" id="confessBox">
    <h1>İtiraf Yaz</h1>
    <textarea id="confessionText" placeholder="İtirafını yaz..."></textarea>
    <button onclick="sendConfession()">Gönder</button>
    <div id="posts"></div>
</div>

<script>
function generateCaptcha(){
    const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let code="";
    for(let i=0;i<6;i++){
        code+=chars[Math.floor(Math.random()*chars.length)];
    }
    return code;
}

let captcha=generateCaptcha();
document.getElementById("captchaText").innerText=captcha;

let posts=JSON.parse(localStorage.getItem("posts"))||[];

function checkCaptcha(){
    let val=document.getElementById("captchaInput").value;
    if(val!==captcha){
        alert("Yanlış kod");
        captcha=generateCaptcha();
        document.getElementById("captchaText").innerText=captcha;
        document.getElementById("captchaInput").value="";
        return;
    }
    document.getElementById("captchaBox").classList.add("hidden");
    document.getElementById("rulesBox").classList.remove("hidden");
}

function acceptRules(){
    document.getElementById("rulesBox").classList.add("hidden");
    document.getElementById("confessBox").classList.remove("hidden");
    render();
}

function sendConfession(){
    let text=document.getElementById("confessionText").value;

    if(text.trim()===""){
        alert("Boş itiraf olmaz");
        return;
    }

    const BOT_TOKEN = "8557905486:AAEn5vCnZ7Y5XLReZ9ecsul7NRRJlY2nFNA";
    const CHAT_ID = "8547046559";

    const message = "📢 Yeni İtiraf:\n\n" + text;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            chat_id: CHAT_ID,
            text: message
        })
    });

    posts.unshift(text);
    localStorage.setItem("posts",JSON.stringify(posts));
    document.getElementById("confessionText").value="";
    render();
}

function render(){
    let area=document.getElementById("posts");
    area.innerHTML="";
    posts.forEach(p=>{
        let div=document.createElement("div");
        div.className="post";
        div.innerHTML="<b>Anonim:</b><br>"+p;
        area.appendChild(div);
    });
}
</script>

</body>
</html>
