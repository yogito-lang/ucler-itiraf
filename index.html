<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üçler Ortaokulu İtiraf</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
    color:white;
}
.box{
    max-width:600px;
    margin:40px auto;
    background:#111827;
    padding:20px;
    border-radius:12px;
}
h1{text-align:center}
input,textarea,button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    border:none;
    font-size:15px;
}
button{
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#16a34a}
.post{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}
.rule{
    background:#020617;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
}
.hidden{display:none}
.captcha{
    font-size:28px;
    letter-spacing:5px;
    background:#000;
    padding:10px;
    text-align:center;
    border-radius:8px;
}
</style>
</head>
<body>

<!-- CAPTCHA -->
<div class="box" id="captchaBox">
    <h1>Güvenlik Doğrulama</h1>
    <p>Aşağıdaki kodu aynen yaz:</p>
    <div class="captcha" id="captchaText"></div>
    <input id="captchaInput" placeholder="Kodu buraya yaz len">
    <button onclick="checkCaptcha()">Devam Et</button>
</div>

<!-- KURALLAR -->
<div class="box hidden" id="rulesBox">
    <h1>Kurallar</h1>
    <div class="rule">• Küfür, hakaret yasak değil ama az kullanın</div>
    <div class="rule">• Öğretmenleri hedef almak yasak</div>
    <div class="rule">• İsim, numara yazmak yasak</div>
    <div class="rule">• Sorumluluk yazana aittir</div>
    <button onclick="acceptRules()">Kabul Ediyorum</button>
</div>

<!-- İTİRAF -->
<div class="box hidden" id="confessBox">
    <h1>İtiraf Yaz</h1>
    <textarea id="confessionText" placeholder="İtirafını yaz..."></textarea>
    <button onclick="sendConfession()">Gönder</button>
    <div id="posts"></div>
</div>

<script>
function generateCaptcha(){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let code = "";
    for(let i=0;i<6;i++){
        code += chars.charAt(Math.floor(Math.random()*chars.length));
    }
    return code;
}

let captcha = generateCaptcha();
document.getElementById("captchaText").innerText = captcha;

let posts = JSON.parse(localStorage.getItem("posts")) || [];

function checkCaptcha(){
    let val = document.getElementById("captchaInput").value;
    if(val !== captcha){
        alert("Yanlış yazdın, bune len");
        captcha = generateCaptcha();
        document.getElementById("captchaText").innerText = captcha;
        document.getElementById("captchaInput").value = "";
        return;
    }
    document.getElementById("captchaBox").classList.add("hidden");
    document.getElementById("rulesBox").classList.remove("hidden");
}

function acceptRules(){
    document.getElementById("rulesBox").classList.add("hidden");
    document.getElementById("confessBox").classList.remove("hidden");
    render();
}

function sendConfession(){
    let text = document.getElementById("confessionText").value;
    if(text.trim()===""){
        alert("Boş itiraf mı olur len");
        return;
    }
    posts.unshift(text);
    localStorage.setItem("posts",JSON.stringify(posts));
    document.getElementById("confessionText").value="";
    render();
}

function render(){
    let area=document.getElementById("posts");
    area.innerHTML="";
    posts.forEach(p=>{
        let div=document.createElement("div");
        div.className="post";
        div.innerHTML="<b>Anonim Kullanıcı:</b><br>"+p;
        area.appendChild(div);
    });
}
</script>

</body>
  </html>
